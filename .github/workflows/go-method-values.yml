name: Go method-value evidence

on:
  push:
    paths:
      - 'investigations/go-method-values/**'
      - 'README.md'
      - '.github/workflows/go-method-values.yml'
  pull_request:
    paths:
      - 'investigations/go-method-values/**'
      - 'README.md'
      - '.github/workflows/go-method-values.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache: false
      - name: Install pinned published parser dependencies
        run: python -m pip install -r investigations/go-method-values/reproduction/requirements.txt
      - name: Verify both parser copies and compiling controls
        run: python investigations/go-method-values/reproduction/verify.py --work ci-logs/method-values-minimal --output ci-logs/method-values-minimal.json
      - name: Replay captured current-client code-map evidence offline
        run: python investigations/go-method-values/reproduction/check_current_client.py --output ci-logs/current-client-replay.json
      - name: Check receiver and negative-control boundaries
        run: python investigations/go-method-values/reproduction/check_boundaries.py --work ci-logs/boundaries --output ci-logs/boundaries.json
      - name: Replay current public-repository A-B-C evidence offline
        run: python investigations/go-method-values/reproduction/check_current_public.py --output ci-logs/current-public.json --focused-output ci-logs/focused-current.zip
      - name: Replay completed current MySQL A-B-C reviews offline
        run: python investigations/go-method-values/reproduction/check_current_public.py --artifacts investigations/go-method-values/evidence/current-mysql-0.4.0 --output ci-logs/current-mysql.json --focused-output ci-logs/focused-mysql.zip
      - name: Pin unchanged public go-redis source
        if: runner.os == 'Linux'
        run: |
          git clone https://github.com/redis/go-redis.git ci-logs/redis
          git -C ci-logs/redis checkout 5cba5e182946cf18a757718938bc43910e589466
      - name: Verify both public graphs and actual focused exports
        if: runner.os == 'Linux'
        run: |
          set -o pipefail
          python investigations/go-method-values/reproduction/verify.py --repo ci-logs/redis --work ci-logs/method-values --output ci-logs/method-values.json | tee ci-logs/method-values.log
          python investigations/go-method-values/reproduction/explain_context.py --repo ci-logs/redis --artifacts ci-logs/method-values/public/00a --verification ci-logs/method-values.json --budget-control-work ci-logs/budget-control --output ci-logs/context-audit.json
          python investigations/go-method-values/reproduction/measure_developer_impact.py --repo ci-logs/redis --artifacts ci-logs/method-values/public/00a --output ci-logs/developer-impact.json
          go build -o ci-logs/compiler-oracle investigations/go-method-values/reproduction/compiler_oracle.go
          ci-logs/compiler-oracle -repo ci-logs/redis -package . -cases ci-logs/method-values-compiler-cases.json -output ci-logs/compiler-method-values.json
          cd ci-logs/redis
          go test -mod=readonly -c -o ../redis-tests .
      - name: Compile public A-B-C controls and test A-B behavior
        if: runner.os == 'Linux'
        run: |
          python investigations/go-method-values/reproduction/prepare_current_public.py --repo ci-logs/redis --work ci-logs/current-inputs
          go -C ci-logs/current-inputs/A test -mod=readonly -count=1 -v -run '^(TestMultiDBPipelineRoutesToActive|TestMultiDBPipelineFailoverRetry)$' .
          go -C ci-logs/current-inputs/B test -mod=readonly -count=1 -v -run '^(TestMultiDBPipelineRoutesToActive|TestMultiDBPipelineFailoverRetry)$' .
          go -C ci-logs/current-inputs/C test -mod=readonly -run '^$' .
      - name: Replicate independently on pinned MySQL driver
        if: runner.os == 'Linux'
        run: |
          git clone https://github.com/go-sql-driver/mysql.git ci-logs/mysql
          git -C ci-logs/mysql checkout 4cdf75e9037ffccf63a981d10f5c2e669edbfc49
          python investigations/go-method-values/reproduction/replicate_mysql.py --repo ci-logs/mysql --work ci-logs/mysql-replay --output ci-logs/mysql.json
          ci-logs/compiler-oracle -repo ci-logs/mysql -package . -cases ci-logs/mysql-compiler-cases.json -output ci-logs/mysql-compiler.json
          go -C ci-logs/mysql test -mod=readonly -count=1 -v -run '^(TestReadPacketSingleByte|TestReadPacketWrongSequenceID|TestReadPacketSplit|TestWriteExecutePacketValidatesArgsBeforeWriting)$' .
          python investigations/go-method-values/reproduction/prepare_current_public.py --project mysql --repo ci-logs/mysql --work ci-logs/mysql-inputs
          go -C ci-logs/mysql-inputs/A test -mod=readonly -count=1 -v -run '^(TestReadPacketSingleByte|TestReadPacketWrongSequenceID|TestReadPacketSplit|TestWriteExecutePacketValidatesArgsBeforeWriting|TestWriteExecutePacketSendsLongDataBeforeExecute|TestWriteExecutePacketResetsStmtAfterLongDataError)$' .
          go -C ci-logs/mysql-inputs/B test -mod=readonly -count=1 -v -run '^(TestReadPacketSingleByte|TestReadPacketWrongSequenceID|TestReadPacketSplit|TestWriteExecutePacketValidatesArgsBeforeWriting|TestWriteExecutePacketSendsLongDataBeforeExecute|TestWriteExecutePacketResetsStmtAfterLongDataError)$' .
          go -C ci-logs/mysql-inputs/C test -mod=readonly -run '^$' .
      - name: Preserve generated evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: go-method-values-${{ runner.os }}
          path: |
            ci-logs/*.json
            ci-logs/*.log
            ci-logs/focused-current.zip
            ci-logs/focused-mysql.zip
            ci-logs/boundaries/go-test.log
            ci-logs/mysql-replay/00a/*/run/shipready_complete_repository_context.zip
            ci-logs/method-values-minimal/minimal/*-go-test.log
            ci-logs/method-values-minimal/minimal/*/run/shipready_complete_repository_context.zip
            ci-logs/method-values/public/00a/*/run/shipready_complete_repository_context.zip
          if-no-files-found: error
