name: PR verification — JSONC defect reproduced exactly (0.3.15)

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/jsonc-*.yml"
      - "reproduction/**"
      - "solution/**"
      - "evidence/tsconfig-jsonc/reference_solution_validation.json"
      - "evidence/tsconfig-jsonc/version_scope.json"
      - "evidence/tsconfig-jsonc/ecosystem_exposure_sample.json"
      - "evidence/tsconfig-jsonc/ecosystem_loader_behavior.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    # Green here means something precise: on the pinned affected release, the
    # strict control works, every JSONC variant fails in the specific reported
    # way, the post-fix regression fails only for those exact checks, and the
    # reference-loader/evidence checks pass. It does not mean expected behaviour
    # already works; that raw regression is kept as a manual workflow.
    name: Affected-version verification — exact defect, reference loader, evidence
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install the pinned public package normally
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r reproduction/requirements-ci.txt
          python -m pip show unvibecode

      - name: Confirm TypeScript accepts the JSONC fixtures
        run: |
          mkdir -p ci-logs
          set -o pipefail
          for fixture in minimal_strict minimal_jsonc minimal_blockcomment minimal_trailingcomma minimal_stringsafety minimal_combined_jsonc; do
            echo "=== ${fixture} ==="
            npm exec --yes --package typescript@5.9.3 -- tsc \
              -p "reproduction/${fixture}/tsconfig.json" --showConfig \
              | tee "ci-logs/tsc-${fixture}-showConfig.json" \
              | grep -A4 '"paths"' \
              | tee "ci-logs/tsc-${fixture}-paths.txt"
          done

      # verify.py runs repro_unit.py, then runs repro_unit.py --expect-fixed
      # and accepts that child failure only if it is exit 1 with exactly the
      # four JSONC fixtures reporting aliases={} / resolution=(None, None).
      # Any installation error, traceback, extra failure, missing failure, or
      # already-fixed behaviour makes this step fail. No continue-on-error.
      - name: Unified affected-version verification (bug + exact regression failure + reference loader)
        run: |
          set -o pipefail
          python reproduction/verify.py 2>&1 | tee ci-logs/verify-affected-version.log

      # Reproduce the differential reference-solution evidence in CI rather
      # than relying only on the locally generated committed JSON.  These are
      # validation-only dependencies; they are not product/runtime deps.
      - name: Differential reference-solution validation (TypeScript + jsonc-parser)
        run: |
          set -o pipefail
          python -m pip install "json-with-comments==1.3.0" "json5==0.17.3"
          mkdir -p "$RUNNER_TEMP/tsconfig-oracles"
          npm install --silent --prefix "$RUNNER_TEMP/tsconfig-oracles" \
            typescript@5.9.3 jsonc-parser@3.3.1
          TSCONFIG_ORACLE_PACKAGE_JSON="$RUNNER_TEMP/tsconfig-oracles/package.json" \
          python solution/validate_reference_solution.py \
            --oracle-package-json "$RUNNER_TEMP/tsconfig-oracles/package.json" \
            --output ci-logs/reference-solution-validation.json \
            2>&1 | tee ci-logs/reference-solution-validation.log
          python - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(Path("ci-logs/reference-solution-validation.json").read_text())
          oracle = result["node_oracles"]
          assert result["status"] == "passed", result
          assert oracle["typescript_version"] == "5.9.3", oracle
          assert oracle["jsonc_parser_version"] == "3.3.1", oracle
          assert oracle["typescript_valid_agreements"] == 514, oracle
          assert oracle["typescript_invalid_diagnostics"] == 8, oracle
          assert oracle["jsonc_parser_valid_agreements"] == 510, oracle
          assert oracle["jsonc_parser_invalid_diagnostics"] == 8, oracle
          print(
              "::notice title=Reference-solution differential validation::"
              "candidate/TypeScript valid agreements=514/514; "
              "candidate/jsonc-parser valid agreements=510/514; "
              "diagnosed invalid cases=8"
          )
          PY

      # This repeats the lightweight checks inside causal_intervention.py and
      # then runs the same A/B/C/D/E sequence through the installed Fast Lane
      # run_pipeline(), inspecting the actual graph and context ZIP.  Step D
      # patches only the resolver method in memory; the repository/config and
      # installed package files are not modified.
      - name: Reversible causal intervention — full Fast Lane graph and context
        run: |
          set -o pipefail
          python reproduction/causal_intervention.py \
            --full-pipeline \
            --work-root "$RUNNER_TEMP/causal-intervention" \
            --keep-work \
            --output ci-logs/causal-intervention-full.json \
            2>&1 | tee ci-logs/causal-intervention-full.log

      - name: Ordinary-install CLI comparison
        run: |
          set -o pipefail
          python reproduction/ci_cli_comparison.py \
            --output-root "$RUNNER_TEMP/jsonc-cli-comparison" \
            --timeout 600 2>&1 | tee ci-logs/cli-comparison.log
          cp "$RUNNER_TEMP/jsonc-cli-comparison/cli-comparison-summary.json" ci-logs/

      - name: Publish CLI comparison key facts as an annotation
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("ci-logs/cli-comparison-summary.json")
          if not path.exists():
              print("::notice title=Ordinary-install CLI comparison::summary unavailable")
              raise SystemExit(0)
          summary = json.loads(path.read_text(encoding="utf-8"))

          def facts(label):
              run = summary[label]
              stage = run.get("stage1", {})
              return (
                  f"{label}: cli_exit={run.get('cli_exit')}, timed_out={run.get('cli_timed_out')}, "
                  f"files={stage.get('files')}, file_edges={stage.get('file_edges')}, "
                  f"unresolved={stage.get('unresolved')}, "
                  f"file_import={len(run.get('alias_file_import_connections', []))}, "
                  f"symbol_fallback={len(run.get('alias_symbol_connections', []))}, "
                  f"grammar_download_error={run.get('grammar_download_error')}"
              )

          print(
              "::notice title=Ordinary-install CLI comparison::"
              f"status={summary['status']}; {facts('strict')}; {facts('jsonc')}"
          )
          PY

      - name: Upload sanitized verification logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jsonc-verification-logs
          path: ci-logs/
          if-no-files-found: warn

  platform_python_scope:
    # Behavioural complement to the all-wheel AST scan: install the same
    # pinned release normally on multiple ordinary CPython/platform
    # combinations and require the exact resolver symptom plus reference
    # loader behaviour.  This lightweight job skips only the committed
    # lexical/ng-matero evidence reconciliation, which the main job checks.
    name: Platform/Python scope — ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: ubuntu-latest
            python-version: "3.14"
          - os: windows-latest
            python-version: "3.12"
          - os: macos-latest
            python-version: "3.12"
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the pinned public package normally
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r reproduction/requirements-ci.txt
          python -m pip show unvibecode

      - name: Exact affected-version resolver and reference-loader verification
        run: python reproduction/verify.py --skip-evidence

  patched_install_rehearsal:
    # Separate disposable runner: prove the maintainer-style file changes in
    # a normally loaded installation, then restore the stock hashes.  This
    # job does not alter the repository checkout or any persistent package.
    name: Patched-install rehearsal — file-level reference integration
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the pinned public package normally
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r reproduction/requirements-ci.txt
          python -m pip show unvibecode
          mkdir -p patched-ci-evidence
          python solution/apply_reference_patch.py --check \
            | tee patched-ci-evidence/stock-check.log
          grep -q '"state": "stock_vulnerable"' patched-ci-evidence/stock-check.log

      - name: Apply the reference patch to this disposable installation
        run: |
          python solution/apply_reference_patch.py \
            --backup-dir "$RUNNER_TEMP/unvibecode-stock-backup" \
            --i-understand-this-modifies-site-packages \
            | tee patched-ci-evidence/apply-patch.log
          cp "$RUNNER_TEMP/unvibecode-stock-backup/manifest.json" \
            patched-ci-evidence/stock-backup-manifest.json
          python solution/apply_reference_patch.py --check \
            | tee patched-ci-evidence/patched-check.log
          grep -q '"state": "patched"' patched-ci-evidence/patched-check.log
          grep -q '"reference_matches_solution": true' \
            patched-ci-evidence/patched-check.log

      - name: Validate patched engines and full Fast Lane without monkeypatching
        run: |
          python solution/validate_patched_install.py \
            --full-pipeline \
            --output patched-ci-evidence/patched-install-validation.json \
            | tee patched-ci-evidence/patched-install-validation.log

      - name: Raw post-fix regression on the patched installation
        run: |
          python reproduction/verify.py --expect-fixed --skip-evidence \
            | tee patched-ci-evidence/verify-expect-fixed.log

      - name: Restore stock files and verify their hashes
        if: always()
        run: |
          python solution/apply_reference_patch.py \
            --restore "$RUNNER_TEMP/unvibecode-stock-backup" \
            --i-understand-this-modifies-site-packages \
            | tee patched-ci-evidence/restore-patch.log
          python solution/apply_reference_patch.py --check \
            | tee patched-ci-evidence/restored-check.log
          grep -q '"state": "stock_vulnerable"' \
            patched-ci-evidence/restored-check.log
          grep -q '"reference_installed": false' \
            patched-ci-evidence/restored-check.log

      - name: Publish patched-install result as an annotation
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("patched-ci-evidence/patched-install-validation.json")
          if not path.is_file():
              print("::notice title=Patched-install rehearsal::validation output unavailable")
              raise SystemExit(0)
          data = json.loads(path.read_text())
          engines = ",".join(row["engine"] for row in data.get("resolver_checks", []))
          full = data.get("full_pipeline", {})
          valid_edges = full.get("valid_jsonc", {}).get("observed_source_edge_pairs", [])
          malformed_warnings = full.get("malformed", {}).get("graph_warnings", [])
          print(
              "::notice title=Patched-install rehearsal::"
              f"status={data.get('status')}; patched resolvers={engines}; "
              f"valid JSONC source edges={valid_edges}; "
              f"malformed graph warning codes="
              f"{[row.get('code') for row in malformed_warnings]}; "
              "stock restore/hash check runs in the same disposable job"
          )
          PY

      - name: Upload patched-install rehearsal evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: patched-install-rehearsal-evidence
          path: patched-ci-evidence/
          if-no-files-found: warn
