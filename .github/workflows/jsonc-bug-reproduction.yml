name: PR verification — JSONC defect reproduced exactly (0.3.15)

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/jsonc-*.yml"
      - "reproduction/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    # Green here means something precise: on the pinned affected release, the
    # strict control works, every JSONC variant fails in the specific reported
    # way, the post-fix regression fails only for those exact checks, and the
    # correction PoC/evidence checks pass. It does not mean expected behaviour
    # already works; that raw regression is kept as a manual workflow.
    name: Affected-version verification — exact defect, correction PoC, evidence
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install the pinned public package normally
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r reproduction/requirements-ci.txt
          python -m pip show unvibecode

      - name: Confirm TypeScript accepts the JSONC fixtures
        run: |
          mkdir -p ci-logs
          set -o pipefail
          for fixture in minimal_strict minimal_jsonc minimal_blockcomment minimal_trailingcomma minimal_stringsafety minimal_combined_jsonc; do
            echo "=== ${fixture} ==="
            npm exec --yes --package typescript@5.9.3 -- tsc \
              -p "reproduction/${fixture}/tsconfig.json" --showConfig \
              | tee "ci-logs/tsc-${fixture}-showConfig.json" \
              | grep -A4 '"paths"' \
              | tee "ci-logs/tsc-${fixture}-paths.txt"
          done

      # verify.py runs repro_unit.py, then runs repro_unit.py --expect-fixed
      # and accepts that child failure only if it is exit 1 with exactly the
      # four JSONC fixtures reporting aliases={} / resolution=(None, None).
      # Any installation error, traceback, extra failure, missing failure, or
      # already-fixed behaviour makes this step fail. No continue-on-error.
      - name: Unified affected-version verification (bug + exact regression failure + PoC)
        run: |
          set -o pipefail
          python reproduction/verify.py 2>&1 | tee ci-logs/verify-affected-version.log

      # This repeats the lightweight checks inside causal_intervention.py and
      # then runs the same A/B/C/D/E sequence through the installed Fast Lane
      # run_pipeline(), inspecting the actual graph and context ZIP.  Step D
      # patches only the resolver method in memory; the repository/config and
      # installed package files are not modified.
      - name: Reversible causal intervention — full Fast Lane graph and context
        run: |
          set -o pipefail
          python reproduction/causal_intervention.py \
            --full-pipeline \
            --work-root "$RUNNER_TEMP/causal-intervention" \
            --keep-work \
            --output ci-logs/causal-intervention-full.json \
            2>&1 | tee ci-logs/causal-intervention-full.log

      - name: Ordinary-install CLI comparison
        run: |
          set -o pipefail
          python reproduction/ci_cli_comparison.py \
            --output-root "$RUNNER_TEMP/jsonc-cli-comparison" \
            --timeout 600 2>&1 | tee ci-logs/cli-comparison.log
          cp "$RUNNER_TEMP/jsonc-cli-comparison/cli-comparison-summary.json" ci-logs/

      - name: Publish CLI comparison key facts as an annotation
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("ci-logs/cli-comparison-summary.json")
          if not path.exists():
              print("::notice title=Ordinary-install CLI comparison::summary unavailable")
              raise SystemExit(0)
          summary = json.loads(path.read_text(encoding="utf-8"))

          def facts(label):
              run = summary[label]
              stage = run.get("stage1", {})
              return (
                  f"{label}: cli_exit={run.get('cli_exit')}, timed_out={run.get('cli_timed_out')}, "
                  f"files={stage.get('files')}, file_edges={stage.get('file_edges')}, "
                  f"unresolved={stage.get('unresolved')}, "
                  f"file_import={len(run.get('alias_file_import_connections', []))}, "
                  f"symbol_fallback={len(run.get('alias_symbol_connections', []))}, "
                  f"grammar_download_error={run.get('grammar_download_error')}"
              )

          print(
              "::notice title=Ordinary-install CLI comparison::"
              f"status={summary['status']}; {facts('strict')}; {facts('jsonc')}"
          )
          PY

      - name: Upload sanitized verification logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jsonc-verification-logs
          path: ci-logs/
          if-no-files-found: warn
