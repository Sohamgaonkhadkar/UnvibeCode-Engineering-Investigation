name: JSONC defect reproduction (UnvibeCode 0.3.15)

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/jsonc-*.yml"
      - "reproduction/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    name: Reproduce known defect and validate correction PoC
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install the pinned public package normally
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r reproduction/requirements-ci.txt
          python -m pip show unvibecode

      - name: Confirm TypeScript accepts the JSONC fixtures
        run: |
          mkdir -p ci-logs
          set -o pipefail
          for fixture in minimal_strict minimal_jsonc minimal_blockcomment minimal_trailingcomma minimal_stringsafety; do
            echo "=== ${fixture} ==="
            npm exec --yes --package typescript@5.9.3 -- tsc \
              -p "reproduction/${fixture}/tsconfig.json" --showConfig \
              | tee "ci-logs/tsc-${fixture}-showConfig.json" \
              | grep -A4 '"paths"' \
              | tee "ci-logs/tsc-${fixture}-paths.txt"
          done

      - name: Unit-level known-bug reproduction (expected to pass as a bug demo)
        run: |
          set -o pipefail
          python reproduction/repro_unit.py 2>&1 | tee ci-logs/repro-unit-known-bug.log

      - name: Correction proof of concept
        run: |
          set -o pipefail
          python reproduction/correction_poc.py 2>&1 | tee ci-logs/correction-poc.log

      - name: Ordinary-install CLI comparison
        run: |
          set -o pipefail
          python reproduction/ci_cli_comparison.py \
            --output-root "$RUNNER_TEMP/jsonc-cli-comparison" \
            --timeout 600 2>&1 | tee ci-logs/cli-comparison.log
          cp "$RUNNER_TEMP/jsonc-cli-comparison/cli-comparison-summary.json" ci-logs/

      - name: Upload sanitized verification logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jsonc-verification-logs
          path: ci-logs/
          if-no-files-found: warn
