name: JSONC expected behavior regression (red on 0.3.15)

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/jsonc-*.yml"
      - "reproduction/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  expected-behavior:
    name: Expected behavior — should fail until the resolver is fixed
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the pinned public package normally
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r reproduction/requirements-ci.txt
          python -m pip show unvibecode

      # Deliberately no continue-on-error: on unvibecode 0.3.15 this check is
      # expected to be red. It should become green only when JSONC tsconfigs
      # retain their compilerOptions.paths aliases.
      - name: Post-fix regression test (red on 0.3.15)
        run: python reproduction/repro_unit.py --expect-fixed
