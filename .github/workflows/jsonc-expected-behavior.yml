name: Manual post-fix regression — JSONC expected behavior

# Manual only. This is deliberately NOT a pull-request gate on the affected
# 0.3.15 release: a red PR check would look like a broken investigation even
# though failure is the reported defect. The PR gate in
# jsonc-bug-reproduction.yml invokes this same regression through verify.py
# and passes only when it fails for the exact documented symptom.
#
# Run this workflow manually against a candidate fixed release. It should be
# green only when correct JSONC handling works. There is no continue-on-error.
on:
  workflow_dispatch:
    inputs:
      unvibecode_version:
        description: "UnvibeCode version to test"
        required: true
        default: "0.3.15"
        type: string

permissions:
  contents: read

jobs:
  expected-behavior:
    name: Manual only — expected behavior (red on 0.3.15, green requires fix)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the selected UnvibeCode release normally
        run: |
          python -m pip install --upgrade pip
          python -m pip install "unvibecode==${{ inputs.unvibecode_version }}"
          python -m pip show unvibecode

      - name: Raw post-fix regression test
        run: python reproduction/repro_unit.py --expect-fixed
