name: Lexical clean-environment validation

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/lexical-clean-environment.yml"
      - "reproduction/analyze_alias_oracle.py"
      - "reproduction/capture_run.py"
      - "reproduction/causal_intervention.py"
      - "reproduction/compare_selections.py"
      - "reproduction/answerability_audit.py"
      - "reproduction/answerability_tasks.json"
      - "reproduction/symbol_evidence_audit.py"
      - "reproduction/jsonc_tolerant.py"
      - "solution/tsconfig_jsonc.py"
      - "evidence/tsconfig-jsonc/lexical_tsconfig_control.json"
      - "evidence/tsconfig-jsonc/lost_relationships.jsonl"
      - "evidence/tsconfig-jsonc/selection_case_react_extension.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lexical:
    name: Standard install — lexical original vs comment-stripped control
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      LEXICAL_COMMIT: 164af6a4df7114f35724c472152ca74877b6bd04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the pinned public package normally
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r reproduction/requirements-ci.txt
          python -m pip show unvibecode

      - name: Fetch lexical at the pinned commit and prepare the control
        run: |
          mkdir -p "$RUNNER_TEMP/lexical"
          git -C "$RUNNER_TEMP/lexical" init
          git -C "$RUNNER_TEMP/lexical" remote add origin https://github.com/meta/lexical.git
          git -C "$RUNNER_TEMP/lexical" fetch --depth 1 origin "$LEXICAL_COMMIT"
          git -C "$RUNNER_TEMP/lexical" checkout --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/lexical" rev-parse HEAD)" = "$LEXICAL_COMMIT"
          cp -a "$RUNNER_TEMP/lexical" "$RUNNER_TEMP/lexical_ctrl"
          cp evidence/tsconfig-jsonc/lexical_tsconfig_control.json \
            "$RUNNER_TEMP/lexical_ctrl/tsconfig.json"
          diff -u "$RUNNER_TEMP/lexical/tsconfig.json" \
            "$RUNNER_TEMP/lexical_ctrl/tsconfig.json" || true

      - name: Run ordinary-install CLI on lexical as-is and control
        run: |
          python reproduction/capture_run.py \
            --repository "$RUNNER_TEMP/lexical" \
            --output-dir "$RUNNER_TEMP/capture_lexical" \
            --timeout 900
          python reproduction/capture_run.py \
            --repository "$RUNNER_TEMP/lexical_ctrl" \
            --output-dir "$RUNNER_TEMP/capture_lexical_ctrl" \
            --timeout 900
          grep '\[STAGE 1 COMPLETE\]' \
            "$RUNNER_TEMP/capture_lexical/connected_code_map.log"
          grep '\[STAGE 1 COMPLETE\]' \
            "$RUNNER_TEMP/capture_lexical_ctrl/connected_code_map.log"

      - name: Recompute strict paths oracle and context-selection impact
        run: |
          mkdir -p lexical-ci-evidence
          python reproduction/analyze_alias_oracle.py \
            --graph-as-is "$RUNNER_TEMP/capture_lexical/resolved_graph.json" \
            --graph-control "$RUNNER_TEMP/capture_lexical_ctrl/resolved_graph.json" \
            --source-root "$RUNNER_TEMP/lexical" \
            --tsconfig "$RUNNER_TEMP/lexical/tsconfig.json" \
            --lost-output lexical-ci-evidence/lost_relationships.jsonl \
            --summary-output lexical-ci-evidence/alias_oracle_summary.json
          python reproduction/compare_selections.py \
            --bundle-as-is "$RUNNER_TEMP/capture_lexical/repository-context.zip" \
            --bundle-control "$RUNNER_TEMP/capture_lexical_ctrl/repository-context.zip" \
            --lost-relationships lexical-ci-evidence/lost_relationships.jsonl \
            --summary-output lexical-ci-evidence/selection_impact_summary.json \
            --omissions-output lexical-ci-evidence/direct_selection_omissions.jsonl
          cp "$RUNNER_TEMP/capture_lexical/connected_code_map.log" \
            lexical-ci-evidence/lexical-as-is-connected-code.log
          cp "$RUNNER_TEMP/capture_lexical_ctrl/connected_code_map.log" \
            lexical-ci-evidence/lexical-control-connected-code.log

      # Diagnostic causal control: keep lexical's original tsconfig bytes and
      # patch only _load_tsconfig_aliases in the Fast Lane module in memory.
      # The script asserts the config and ReactExtension source hashes are
      # unchanged after the run and restores the stock method before exit.
      - name: In-memory-corrected Fast Lane on unmodified lexical
        run: |
          python reproduction/causal_intervention.py \
            --lexical-root "$RUNNER_TEMP/lexical" \
            --lexical-output-root "$RUNNER_TEMP/corrected-lexical-output" \
            --lost-relationships lexical-ci-evidence/lost_relationships.jsonl \
            --selection-case evidence/tsconfig-jsonc/selection_case_react_extension.json \
            --output lexical-ci-evidence/causal-intervention-lexical.json
          corrected_bundle="$(find "$RUNNER_TEMP/corrected-lexical-output" \
            -name shipready_complete_repository_context.zip -print -quit)"
          test -n "$corrected_bundle"
          python reproduction/compare_selections.py \
            --bundle-as-is "$RUNNER_TEMP/capture_lexical/repository-context.zip" \
            --bundle-control "$corrected_bundle" \
            --lost-relationships lexical-ci-evidence/lost_relationships.jsonl \
            --summary-output lexical-ci-evidence/selection_impact_corrected_vs_stock.json \
            --omissions-output lexical-ci-evidence/direct_selection_omissions_corrected_vs_stock.jsonl

      # Deterministic final-artifact check: exact answer-bearing lines must
      # be present in selected Optimal chunks from the answering files.  It
      # makes no LLM-output claim.
      - name: Answer-bearing lines in actual exported Optimal bundles
        run: |
          corrected_bundle="$(find "$RUNNER_TEMP/corrected-lexical-output" \
            -name shipready_complete_repository_context.zip -print -quit)"
          test -n "$corrected_bundle"
          python reproduction/answerability_audit.py \
            --tasks reproduction/answerability_tasks.json \
            --bundle "as_is=$RUNNER_TEMP/capture_lexical/repository-context.zip" \
            --bundle "control=$RUNNER_TEMP/capture_lexical_ctrl/repository-context.zip" \
            --bundle "corrected=$corrected_bundle" \
            --output lexical-ci-evidence/answerability_audit.json

      # Scale final-artifact evidence beyond the six representative tasks:
      # for every eligible imported symbol on a verified lost relationship,
      # require a recognizable declaration/export line in the selected chunks
      # for the importing source.
      - name: Exhaustive symbol-definition evidence in exported bundles
        run: |
          corrected_bundle="$(find "$RUNNER_TEMP/corrected-lexical-output" \
            -name shipready_complete_repository_context.zip -print -quit)"
          test -n "$corrected_bundle"
          python reproduction/symbol_evidence_audit.py \
            --graph-control "$RUNNER_TEMP/capture_lexical_ctrl/resolved_graph.json" \
            --lost-relationships lexical-ci-evidence/lost_relationships.jsonl \
            --bundle "as_is=$RUNNER_TEMP/capture_lexical/repository-context.zip" \
            --bundle "control=$RUNNER_TEMP/capture_lexical_ctrl/repository-context.zip" \
            --bundle "corrected=$corrected_bundle" \
            --radius 1 \
            --radius 2 \
            --output lexical-ci-evidence/symbol_evidence_audit.json \
            --details-output lexical-ci-evidence/symbol_evidence_details.jsonl

      - name: Assert and publish key lexical counts as an annotation
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          oracle = json.loads(Path("lexical-ci-evidence/alias_oracle_summary.json").read_text())
          selections = json.loads(Path("lexical-ci-evidence/selection_impact_summary.json").read_text())
          graph_a = oracle["inputs"]["graph_as_is"]["summary"]
          graph_b = oracle["inputs"]["graph_control"]["summary"]
          strong = oracle["strong_oracle"]
          recovered = selections["direct_dependency_recovered"]["instances_by_scope"]
          optimal = next(value for key, value in recovered.items() if key.startswith("Optimal"))
          assert graph_a["edges"] == 1263 and graph_b["edges"] == 5519, (graph_a, graph_b)
          assert strong["classification"] == {"verified_paths_target": 4256}, strong
          assert optimal == 2707, recovered

          causal = json.loads(Path("lexical-ci-evidence/causal-intervention-lexical.json").read_text())
          corrected = causal["lexical_corrected_fastlane"]
          corrected_selections = json.loads(
              Path("lexical-ci-evidence/selection_impact_corrected_vs_stock.json").read_text()
          )
          corrected_recovered = corrected_selections["direct_dependency_recovered"]["instances_by_scope"]
          corrected_optimal = next(
              value for key, value in corrected_recovered.items() if key.startswith("Optimal")
          )
          corrected_wider = next(
              value for key, value in corrected_recovered.items() if key.startswith("Wider")
          )
          assert corrected["graph_summary"]["edges"] == 5519, corrected["graph_summary"]
          assert corrected["verified_relationships_present"] == 4256, corrected
          assert corrected["matches_comment_stripped_control_selection_exactly"] is True
          assert corrected_optimal == 2707 and corrected_wider == 3345, corrected_recovered

          answerability = json.loads(
              Path("lexical-ci-evidence/answerability_audit.json").read_text()
          )
          answers = answerability["summary"]
          assert answerability["status"] == "passed", answerability
          assert answers["as_is"] == {
              "impact_answerable": 0,
              "impact_total": 6,
              "negative_control_answerable": 1,
              "negative_control_total": 1,
          }, answers
          assert answers["control"]["impact_answerable"] == 6, answers
          assert answers["corrected"]["impact_answerable"] == 6, answers

          symbols = json.loads(
              Path("lexical-ci-evidence/symbol_evidence_audit.json").read_text()
          )
          assert symbols["status"] == "passed", symbols
          derivation = symbols["task_derivation"]
          assert derivation["eligible_symbol_tasks"] > 0, derivation
          symbol_radii = {}
          for radius in ("1", "2"):
              entry = symbols["by_radius"][radius]
              recovered_control = entry["comparisons"]["as_is_to_control"]["states"].get(
                  "definition_recovered", 0
              )
              recovered_corrected = entry["comparisons"]["as_is_to_corrected"]["states"].get(
                  "definition_recovered", 0
              )
              assert recovered_control > 0 and recovered_corrected > 0, entry
              symbol_radii[radius] = (
                  entry["definition_available_by_bundle"],
                  recovered_control,
                  recovered_corrected,
              )
          print(
              "::notice title=Lexical clean-environment validation::"
              f"as-is edges={graph_a['edges']}, control edges={graph_b['edges']}, "
              f"verified lost file relationships={strong['gained_file_edges_total']}, "
              f"Optimal direct dependencies recovered={optimal}; "
              f"in-memory corrected original edges={corrected['graph_summary']['edges']}, "
              f"corrected-vs-stock Optimal/Wider={corrected_optimal}/{corrected_wider}; "
              f"answer-bearing Optimal tasks as-is/control/corrected="
              f"{answers['as_is']['impact_answerable']}/"
              f"{answers['control']['impact_answerable']}/"
              f"{answers['corrected']['impact_answerable']} of 6; "
              f"eligible symbol-definition tasks={derivation['eligible_symbol_tasks']} "
              f"(candidate={derivation['candidate_symbol_tasks']}, "
              f"sources={derivation['distinct_source_files']}, "
              f"definition_files={derivation['distinct_definition_files']}); "
              f"Optimal definitions as-is/control/corrected="
              f"{symbol_radii['1'][0]['as_is']}/{symbol_radii['1'][0]['control']}/"
              f"{symbol_radii['1'][0]['corrected']}, recovered control/corrected="
              f"{symbol_radii['1'][1]}/{symbol_radii['1'][2]}; "
              f"Wider definitions as-is/control/corrected="
              f"{symbol_radii['2'][0]['as_is']}/{symbol_radii['2'][0]['control']}/"
              f"{symbol_radii['2'][0]['corrected']}, recovered control/corrected="
              f"{symbol_radii['2'][1]}/{symbol_radii['2'][2]}"
          )
          PY

      - name: Upload lexical clean-environment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lexical-clean-environment-evidence
          path: lexical-ci-evidence/
          if-no-files-found: warn
