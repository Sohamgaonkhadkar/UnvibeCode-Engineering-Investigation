name: Lexical clean-environment validation

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/lexical-clean-environment.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lexical:
    name: Standard install — lexical original vs comment-stripped control
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      LEXICAL_COMMIT: 164af6a4df7114f35724c472152ca74877b6bd04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the pinned public package normally
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r reproduction/requirements-ci.txt
          python -m pip show unvibecode

      - name: Fetch lexical at the pinned commit and prepare the control
        run: |
          mkdir -p "$RUNNER_TEMP/lexical"
          git -C "$RUNNER_TEMP/lexical" init
          git -C "$RUNNER_TEMP/lexical" remote add origin https://github.com/meta/lexical.git
          git -C "$RUNNER_TEMP/lexical" fetch --depth 1 origin "$LEXICAL_COMMIT"
          git -C "$RUNNER_TEMP/lexical" checkout --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/lexical" rev-parse HEAD)" = "$LEXICAL_COMMIT"
          cp -a "$RUNNER_TEMP/lexical" "$RUNNER_TEMP/lexical_ctrl"
          cp evidence/tsconfig-jsonc/lexical_tsconfig_control.json \
            "$RUNNER_TEMP/lexical_ctrl/tsconfig.json"
          diff -u "$RUNNER_TEMP/lexical/tsconfig.json" \
            "$RUNNER_TEMP/lexical_ctrl/tsconfig.json" || true

      - name: Run ordinary-install CLI on lexical as-is and control
        run: |
          python reproduction/capture_run.py \
            --repository "$RUNNER_TEMP/lexical" \
            --output-dir "$RUNNER_TEMP/capture_lexical" \
            --timeout 900
          python reproduction/capture_run.py \
            --repository "$RUNNER_TEMP/lexical_ctrl" \
            --output-dir "$RUNNER_TEMP/capture_lexical_ctrl" \
            --timeout 900
          grep '\[STAGE 1 COMPLETE\]' \
            "$RUNNER_TEMP/capture_lexical/connected_code_map.log"
          grep '\[STAGE 1 COMPLETE\]' \
            "$RUNNER_TEMP/capture_lexical_ctrl/connected_code_map.log"

      - name: Recompute strict paths oracle and context-selection impact
        run: |
          mkdir -p lexical-ci-evidence
          python reproduction/analyze_alias_oracle.py \
            --graph-as-is "$RUNNER_TEMP/capture_lexical/resolved_graph.json" \
            --graph-control "$RUNNER_TEMP/capture_lexical_ctrl/resolved_graph.json" \
            --source-root "$RUNNER_TEMP/lexical" \
            --tsconfig "$RUNNER_TEMP/lexical/tsconfig.json" \
            --lost-output lexical-ci-evidence/lost_relationships.jsonl \
            --summary-output lexical-ci-evidence/alias_oracle_summary.json
          python reproduction/compare_selections.py \
            --bundle-as-is "$RUNNER_TEMP/capture_lexical/repository-context.zip" \
            --bundle-control "$RUNNER_TEMP/capture_lexical_ctrl/repository-context.zip" \
            --lost-relationships lexical-ci-evidence/lost_relationships.jsonl \
            --summary-output lexical-ci-evidence/selection_impact_summary.json \
            --omissions-output lexical-ci-evidence/direct_selection_omissions.jsonl
          cp "$RUNNER_TEMP/capture_lexical/connected_code_map.log" \
            lexical-ci-evidence/lexical-as-is-connected-code.log
          cp "$RUNNER_TEMP/capture_lexical_ctrl/connected_code_map.log" \
            lexical-ci-evidence/lexical-control-connected-code.log

      - name: Assert and publish key lexical counts as an annotation
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          oracle = json.loads(Path("lexical-ci-evidence/alias_oracle_summary.json").read_text())
          selections = json.loads(Path("lexical-ci-evidence/selection_impact_summary.json").read_text())
          graph_a = oracle["inputs"]["graph_as_is"]["summary"]
          graph_b = oracle["inputs"]["graph_control"]["summary"]
          strong = oracle["strong_oracle"]
          recovered = selections["direct_dependency_recovered"]["instances_by_scope"]
          optimal = next(value for key, value in recovered.items() if key.startswith("Optimal"))
          assert graph_a["edges"] == 1263 and graph_b["edges"] == 5519, (graph_a, graph_b)
          assert strong["classification"] == {"verified_paths_target": 4256}, strong
          assert optimal == 2707, recovered
          print(
              "::notice title=Lexical clean-environment validation::"
              f"as-is edges={graph_a['edges']}, control edges={graph_b['edges']}, "
              f"verified lost file relationships={strong['gained_file_edges_total']}, "
              f"Optimal direct dependencies recovered={optimal}"
          )
          PY

      - name: Upload lexical clean-environment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lexical-clean-environment-evidence
          path: lexical-ci-evidence/
          if-no-files-found: warn
